<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六级单词 · 沉浸学习</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- 样式 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f7f9fc 0%, #eef2f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 30px 28px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25),
                        0 8px 24px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: 0.2s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #1a2639;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            color: #3b6ea5;
            font-size: 28px;
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .progress-badge {
            background: #1a2639;
            color: white;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-badge i {
            color: #ffd966;
        }

        .status-badge {
            background: #e9eef5;
            color: #1a2639;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-wrapper {
            background: white;
            border-radius: 40px;
            padding: 24px 20px 30px;
            box-shadow: 0 12px 30px -8px rgba(0, 20, 30, 0.12);
            margin-bottom: 28px;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .word-card {
            text-align: center;
            padding: 12px 0 6px;
        }

        .word-en {
            font-size: 48px;
            font-weight: 600;
            color: #0b1e33;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .word-status {
            display: inline-block;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 60px;
            margin-bottom: 10px;
        }

        .word-status.learned {
            background: #d4edda;
            color: #155724;
        }

        .word-status.forgotten {
            background: #f8d7da;
            color: #721c24;
        }

        .word-status.unlearned {
            background: #e9ecef;
            color: #495057;
        }

        .phonetic {
            font-size: 18px;
            color: #4a5b6e;
            background: #eef3f9;
            display: inline-block;
            padding: 4px 20px;
            border-radius: 60px;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .meaning-area {
            background: #f3f7fd;
            border-radius: 32px;
            padding: 18px 12px;
            margin: 8px 0 18px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            border: 1px dashed #cbd5e1;
        }

        .meaning {
            font-size: 24px;
            font-weight: 500;
            color: #1d2b3f;
            letter-spacing: 0.2px;
            line-height: 1.5;
        }

        .meaning.hidden {
            filter: blur(8px);
            opacity: 0.6;
            user-select: none;
            pointer-events: none;
        }

        .extra-info {
            margin: 14px 0 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .example-sentence, .phrase-item {
            font-size: 16px;
            color: #2c3e50;
            background: #f0f4fa;
            padding: 10px 18px;
            border-radius: 60px;
            display: inline-block;
            max-width: 90%;
            border-left: 4px solid #3b6ea5;
        }

        .example-sentence i, .phrase-item i {
            margin-right: 8px;
            color: #3b6ea5;
        }

        .phrase-item {
            border-left-color: #e67e22;
            background: #fdf6ed;
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin: 18px 0 6px;
        }

        .btn {
            border: none;
            background: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.15s ease;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            color: #1e2b3c;
            flex: 1 1 auto;
            justify-content: center;
        }

        .btn-primary {
            background: #1a2639;
            border: 1px solid #1a2639;
            color: white;
            box-shadow: 0 8px 16px -6px rgba(26, 38, 57, 0.2);
        }

        .btn-primary i {
            color: #ffd966;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #bcc9db;
        }

        .btn-outline i {
            color: #4a5b6e;
        }

        .btn-success {
            background: #2a6d4c;
            border-color: #2a6d4c;
            color: white;
        }

        .btn-danger {
            background: #b13e4b;
            border-color: #b13e4b;
            color: white;
        }

        .btn-warning {
            background: #d4852b;
            border-color: #d4852b;
            color: white;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn i {
            font-size: 18px;
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 6px;
        }

        .counter {
            background: #e9eef5;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 500;
            color: #1a2c41;
        }

        .reset-btn {
            background: transparent;
            border: none;
            color: #5b6f84;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 60px;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn:hover {
            background: #dce3ed;
            color: #1a2639;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 20px;
            color: #4a5b6e;
        }

        .loading i {
            margin-right: 12px;
        }

        .pos-tag {
            display: inline-block;
            background: #3b6ea5;
            color: white;
            padding: 2px 14px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            margin-left: 8px;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 16px;
            border-radius: 60px;
            border: 2px solid #dce3ed;
            background: transparent;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: 0.1s;
            color: #4a5b6e;
        }

        .filter-btn.active {
            background: #1a2639;
            color: white;
            border-color: #1a2639;
        }

        .filter-btn:hover {
            border-color: #1a2639;
        }

        @media (max-width: 550px) {
            .app-container {
                padding: 20px 16px;
                border-radius: 32px;
            }
            .word-en {
                font-size: 34px;
            }
            .meaning {
                font-size: 20px;
            }
            .btn {
                padding: 10px 16px;
                font-size: 14px;
            }
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 头部 -->
    <div class="header">
        <h1><i class="fas fa-graduation-cap"></i> 六级 · 词汇</h1>
        <div class="stats">
            <div class="progress-badge">
                <i class="fas fa-check-circle"></i> 
                <span id="progressText">加载中...</span>
            </div>
            <div class="status-badge">
                <i class="fas fa-book"></i>
                <span id="statusText">未学习</span>
            </div>
        </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="unlearned">未学习</button>
        <button class="filter-btn" data-filter="learned">已学会</button>
        <button class="filter-btn" data-filter="forgotten">需复习</button>
    </div>

    <!-- 单词卡片 -->
    <div class="card-wrapper">
        <div id="wordContainer">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> 加载词库中...
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="footer-actions">
        <span class="counter"><i class="far fa-clock"></i> <span id="wordCounter">0 / 0</span></span>
        <div style="display: flex; gap: 10px;">
            <button class="reset-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> 重置进度</button>
            <button class="btn btn-outline" id="prevBtn" style="padding: 8px 18px;"><i class="fas fa-arrow-left"></i></button>
            <button class="btn btn-outline" id="nextBtn" style="padding: 8px 18px;"><i class="fas fa-arrow-right"></i></button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 全局状态 ----------
        let wordList = [];
        let currentIndex = 0;
        let filteredIndices = [];  // 当前筛选后的索引列表
        let filteredIndexPos = 0;  // 在 filteredIndices 中的位置
        
        // 学习状态: 'learned' 或 'forgotten'，未记录表示未学习
        let learningProgress = new Map(); // key: 单词索引, value: 'learned' | 'forgotten'
        
        let isMeaningRevealed = false;
        let currentFilter = 'all'; // 'all' | 'unlearned' | 'learned' | 'forgotten'

        const STORAGE_KEY = 'cet6_learning_progress';

        // DOM 元素
        const wordContainer = document.getElementById('wordContainer');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const wordCounter = document.getElementById('wordCounter');
        const resetBtn = document.getElementById('resetBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // ---------- 存储操作 ----------
        function saveProgress() {
            try {
                const data = {
                    progress: Array.from(learningProgress.entries())
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn('保存进度失败:', e);
            }
        }

        function loadProgress() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (data.progress && Array.isArray(data.progress)) {
                    learningProgress = new Map(data.progress);
                    return true;
                }
                return false;
            } catch (e) {
                console.warn('读取进度失败:', e);
                return false;
            }
        }

        // ---------- 筛选逻辑 ----------
        function getFilteredIndices() {
            let indices = [];
            for (let i = 0; i < wordList.length; i++) {
                const status = learningProgress.get(i);
                if (currentFilter === 'all') {
                    indices.push(i);
                } else if (currentFilter === 'unlearned' && !status) {
                    indices.push(i);
                } else if (currentFilter === 'learned' && status === 'learned') {
                    indices.push(i);
                } else if (currentFilter === 'forgotten' && status === 'forgotten') {
                    indices.push(i);
                }
            }
            return indices;
        }

        function updateFilteredList() {
            filteredIndices = getFilteredIndices();
            // 如果当前索引不在筛选列表中，重置到第一个
            if (filteredIndices.length === 0) {
                filteredIndexPos = -1;
                return;
            }
            // 检查 currentIndex 是否在 filteredIndices 中
            const pos = filteredIndices.indexOf(currentIndex);
            if (pos === -1) {
                filteredIndexPos = 0;
                currentIndex = filteredIndices[0];
            } else {
                filteredIndexPos = pos;
            }
        }

        // ---------- 渲染单词卡片 ----------
        function renderCard(index) {
            if (!wordList.length || index >= wordList.length || index < 0) {
                wordContainer.innerHTML = `<div class="loading"><i class="fas fa-exclamation-circle"></i> 词库为空</div>`;
                return;
            }

            const word = wordList[index];
            if (!word) return;

            // 获取当前单词的学习状态
            const status = learningProgress.get(index);
            let statusTextContent = '';
            let statusClass = '';
            if (status === 'learned') {
                statusTextContent = '✅ 已学会';
                statusClass = 'learned';
            } else if (status === 'forgotten') {
                statusTextContent = '🔄 需要复习';
                statusClass = 'forgotten';
            } else {
                statusTextContent = '📖 未学习';
                statusClass = 'unlearned';
            }

            // 处理翻译
            let mainTranslation = '（无释义）';
            let pos = '';
            if (word.translations && word.translations.length > 0) {
                const first = word.translations[0];
                mainTranslation = first.translation || '（无释义）';
                pos = first.type || '';
            }

            // 处理短语
            let phrasesHtml = '';
            if (word.phrases && word.phrases.length > 0) {
                phrasesHtml = word.phrases.map(p => 
                    `<div class="phrase-item"><i class="fas fa-link"></i> ${p.phrase} — ${p.translation}</div>`
                ).join('');
            }

            // 处理例句
            let exampleHtml = '';
            if (word.examples && word.examples.length > 0) {
                exampleHtml = `<div class="example-sentence"><i class="fas fa-quote-left"></i> ${word.examples[0]}</div>`;
            }

            const cardHtml = `
                <div class="word-card">
                    <div class="word-status ${statusClass}">${statusTextContent}</div>
                    <div class="word-en">${word.word || '未知单词'}</div>
                    <div class="phonetic">${word.phonetic || ''}</div>
                    <div class="meaning-area">
                        <div class="meaning hidden" id="wordMeaning">
                            ${mainTranslation}
                            ${pos ? `<span class="pos-tag">${pos}</span>` : ''}
                        </div>
                    </div>
                    <div class="extra-info">
                        ${exampleHtml}
                        ${phrasesHtml}
                    </div>
                </div>
                <div class="action-group">
                    <button class="btn btn-primary" id="revealBtn"><i class="fas fa-eye"></i> 显示释义</button>
                    <button class="btn btn-success" id="knowBtn"><i class="fas fa-thumbs-up"></i> 认识</button>
                    <button class="btn btn-warning" id="forgetBtn"><i class="fas fa-exclamation-triangle"></i> 忘记</button>
                </div>
            `;

            wordContainer.innerHTML = cardHtml;

            // 绑定事件
            const revealBtn = document.getElementById('revealBtn');
            const knowBtn = document.getElementById('knowBtn');
            const forgetBtn = document.getElementById('forgetBtn');
            const meaningEl = document.getElementById('wordMeaning');

            isMeaningRevealed = false;
            if (meaningEl) {
                meaningEl.classList.add('hidden');
            }

            if (revealBtn) {
                revealBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleReveal(meaningEl, revealBtn);
                });
            }

            if (knowBtn) {
                knowBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    handleKnow(meaningEl, revealBtn);
                });
            }

            if (forgetBtn) {
                forgetBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    handleForget(meaningEl, revealBtn);
                });
            }

            // 双击切换释义
            const cardWrapper = wordContainer.closest('.card-wrapper');
            if (cardWrapper) {
                cardWrapper.ondblclick = function(e) {
                    const currentRevealBtn = document.getElementById('revealBtn');
                    const currentMeaning = document.getElementById('wordMeaning');
                    if (currentRevealBtn && currentMeaning) {
                        toggleReveal(currentMeaning, currentRevealBtn);
                    }
                };
            }

            updateStats();
            updateCounter();
        }

        // ---------- 切换释义 ----------
        function toggleReveal(meaningEl, revealBtn) {
            if (!meaningEl) return;
            if (isMeaningRevealed) {
                meaningEl.classList.add('hidden');
                isMeaningRevealed = false;
                if (revealBtn) {
                    revealBtn.innerHTML = `<i class="fas fa-eye"></i> 显示释义`;
                }
            } else {
                meaningEl.classList.remove('hidden');
                isMeaningRevealed = true;
                if (revealBtn) {
                    revealBtn.innerHTML = `<i class="fas fa-eye-slash"></i> 隐藏释义`;
                }
            }
        }

        // ---------- 处理"认识" ----------
        function handleKnow(meaningEl, revealBtn) {
            learningProgress.set(currentIndex, 'learned');
            saveProgress();

            // 自动显示释义
            if (!isMeaningRevealed && meaningEl) {
                toggleReveal(meaningEl, revealBtn);
            }

            // 按钮反馈
            const knowBtn = document.getElementById('knowBtn');
            if (knowBtn) {
                knowBtn.style.transform = 'scale(0.94)';
                setTimeout(() => { knowBtn.style.transform = 'scale(1)'; }, 120);
            }

            // 重新筛选并跳转
            setTimeout(() => {
                updateFilteredList();
                if (filteredIndices.length > 0) {
                    // 跳到下一个
                    const nextPos = (filteredIndexPos + 1) % filteredIndices.length;
                    filteredIndexPos = nextPos;
                    currentIndex = filteredIndices[nextPos];
                    renderCard(currentIndex);
                }
            }, 300);
        }

        // ---------- 处理"忘记" ----------
        function handleForget(meaningEl, revealBtn) {
            learningProgress.set(currentIndex, 'forgotten');
            saveProgress();

            // 自动显示释义
            if (!isMeaningRevealed && meaningEl) {
                toggleReveal(meaningEl, revealBtn);
            }

            const forgetBtn = document.getElementById('forgetBtn');
            if (forgetBtn) {
                forgetBtn.style.transform = 'scale(0.94)';
                setTimeout(() => { forgetBtn.style.transform = 'scale(1)'; }, 120);
            }

            setTimeout(() => {
                updateFilteredList();
                if (filteredIndices.length > 0) {
                    const nextPos = (filteredIndexPos + 1) % filteredIndices.length;
                    filteredIndexPos = nextPos;
                    currentIndex = filteredIndices[nextPos];
                    renderCard(currentIndex);
                }
            }, 300);
        }

        // ---------- 导航 ----------
        function nextWord() {
            if (!wordList.length || filteredIndices.length === 0) return;
            const nextPos = (filteredIndexPos + 1) % filteredIndices.length;
            filteredIndexPos = nextPos;
            currentIndex = filteredIndices[nextPos];
            renderCard(currentIndex);
        }

        function prevWord() {
            if (!wordList.length || filteredIndices.length === 0) return;
            const prevPos = (filteredIndexPos - 1 + filteredIndices.length) % filteredIndices.length;
            filteredIndexPos = prevPos;
            currentIndex = filteredIndices[prevPos];
            renderCard(currentIndex);
        }

        // ---------- 更新统计 ----------
        function updateStats() {
            const total = wordList.length || 0;
            let learned = 0, forgotten = 0, unlearned = 0;
            for (let i = 0; i < total; i++) {
                const status = learningProgress.get(i);
                if (status === 'learned') learned++;
                else if (status === 'forgotten') forgotten++;
                else unlearned++;
            }
            progressText.textContent = `✅${learned}  🔄${forgotten}  📖${unlearned}`;
            
            // 更新当前单词状态
            const status = learningProgress.get(currentIndex);
            let text = '';
            if (status === 'learned') text = '已学会 ✅';
            else if (status === 'forgotten') text = '需复习 🔄';
            else text = '未学习 📖';
            statusText.textContent = text;
        }

        function updateCounter() {
            const total = filteredIndices.length || 0;
            const pos = filteredIndexPos + 1;
            wordCounter.textContent = `${total > 0 ? pos : 0} / ${total}`;
        }

        // ---------- 重置 ----------
        function resetProgress() {
            if (!wordList.length) return;
            if (!confirm('重置所有学习进度？这将清除所有"认识"和"忘记"的记录。')) return;
            learningProgress.clear();
            saveProgress();
            updateFilteredList();
            if (filteredIndices.length > 0) {
                filteredIndexPos = 0;
                currentIndex = filteredIndices[0];
                renderCard(currentIndex);
            }
            updateStats();
            updateCounter();
        }

        // ---------- 切换筛选 ----------
        function setFilter(filter) {
            currentFilter = filter;
            filterBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            updateFilteredList();
            if (filteredIndices.length > 0) {
                filteredIndexPos = 0;
                currentIndex = filteredIndices[0];
                renderCard(currentIndex);
            } else {
                wordContainer.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-info-circle"></i> 
                        没有符合条件的单词
                    </div>
                `;
                updateCounter();
                updateStats();
            }
        }

        // ---------- 加载 JSON ----------
        function loadWordList() {
            fetch('./cet6-vocabulary.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        wordList = data;
                        
                        // 加载保存的进度
                        const hasProgress = loadProgress();
                        
                        // 初始化筛选
                        updateFilteredList();
                        if (filteredIndices.length > 0) {
                            filteredIndexPos = 0;
                            currentIndex = filteredIndices[0];
                        } else {
                            currentIndex = 0;
                        }
                        renderCard(currentIndex);
                        
                        console.log(`📚 加载了 ${wordList.length} 个单词`);
                        if (hasProgress) {
                            console.log(`💾 恢复了学习进度，已学会 ${learningProgress.size} 个单词`);
                        }
                    } else {
                        throw new Error('JSON 数据格式不正确，期望是一个数组');
                    }
                })
                .catch(error => {
                    console.error('加载词库失败:', error);
                    wordContainer.innerHTML = `
                        <div class="loading" style="color: #b13e4b;">
                            <i class="fas fa-exclamation-triangle"></i> 
                            加载词库失败: ${error.message}<br>
                            <small style="font-size:14px; display:block; margin-top:12px;">
                                请确保 <strong>4-CET6-顺序.json</strong> 文件与 HTML 在同一目录
                            </small>
                        </div>
                    `;
                    progressText.textContent = '0 / 0 / 0';
                    wordCounter.textContent = '0 / 0';
                });
        }

        // ---------- 事件绑定 ----------
        resetBtn.addEventListener('click', resetProgress);

        nextBtn.addEventListener('click', nextWord);
        prevBtn.addEventListener('click', prevWord);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                setFilter(this.dataset.filter);
            });
        });

        // 键盘快捷键
        // 键盘快捷键
document.addEventListener('keydown', function(e) {
    // 忽略输入框等
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    
    const key = e.key;
    const currentRevealBtn = document.getElementById('revealBtn');
    const currentMeaning = document.getElementById('wordMeaning');

    // 1: 显示/隐藏释义
    if (key === '1') {
        e.preventDefault();
        if (currentRevealBtn && currentMeaning) {
            toggleReveal(currentMeaning, currentRevealBtn);
        }
    }
    // 空格键: 认识
    else if (key === ' ' || key === 'Space') {
        e.preventDefault();  // 阻止页面滚动
        if (currentMeaning && currentRevealBtn) {
            handleKnow(currentMeaning, currentRevealBtn);
        }
    }
    // Enter 键: 忘记
    else if (key === 'Enter') {
        e.preventDefault();  // 阻止表单提交等默认行为
        if (currentMeaning && currentRevealBtn) {
            handleForget(currentMeaning, currentRevealBtn);
        }
    }
    // 方向键: 导航
    else if (key === 'ArrowRight') {
        e.preventDefault();
        nextWord();
    }
    else if (key === 'ArrowLeft') {
        e.preventDefault();
        prevWord();
    }
    // R: 重置
    else if (key === 'r' || key === 'R') {
        e.preventDefault();
        resetProgress();
    }
});

        // ---------- 启动 ----------
        loadWordList();

        console.log('📚 六级单词学习网站已启动！');
        console.log('⌨️  快捷键:');
        console.log('  1 - 显示/隐藏释义');
        console.log('  2 - 标记为"认识" (已学会)');
        console.log('  3 - 标记为"忘记" (需复习)');
        console.log('  → - 下一个单词');
        console.log('  ← - 上一个单词');
        console.log('  R - 重置所有进度');
        console.log('💾 学习进度会自动保存在浏览器中');
    })();
</script>
